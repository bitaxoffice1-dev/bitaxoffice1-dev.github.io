<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bitax אזור אישי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app shell, sticky top bar (desktop nav) + bottom tab bar on phones; home = greeting + full mirror of insurance & pension, journey below */
:root{
  --bg:#FFFBF0; --surface:#FFFFFF; --line:#F1E6C8; --ink:#2A2110; --muted:#6B5E45;
  --brand:#F4C845; --on-brand:#2A2110; --brand-soft:#FFF3CF; --amber:#8A5A00;
  --good:#2D6A35; --good-soft:#E8F3E6; --bad:#A3271D; --bad-soft:#FDECEA; --soft:#F3F0E8;
  --inv-bg:#2A2110; --inv-fg:#FFFFFF; --field:#FFFFFF; --field-line:#E3D6B1;
  --c1:#2A2110; --c2:#F4C845; --c3:#B86E00; --c4:#8C7A55; --c5:#4E7CA8; --c6:#D9C9A0;
  --font:"Rubik", "Arial Hebrew", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17140D; --surface:#221E15; --line:#3A3322; --ink:#F6EFDD; --muted:#BDB096;
  --brand:#F4C845; --on-brand:#2A2110; --brand-soft:#3A2F12; --amber:#F4C845;
  --good:#8FD6A0; --good-soft:#1F3424; --bad:#FF9C8F; --bad-soft:#3D1E1A; --soft:#2C271C;
  --inv-bg:#F6EFDD; --inv-fg:#17140D; --field:#1B1810; --field-line:#4A4130;
  --c1:#F6EFDD; --c2:#F4C845; --c3:#E89A3C; --c4:#A8997A; --c5:#7FA9D6; --c6:#5E5440;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17140D; --surface:#221E15; --line:#3A3322; --ink:#F6EFDD; --muted:#BDB096;
  --brand:#F4C845; --on-brand:#2A2110; --brand-soft:#3A2F12; --amber:#F4C845;
  --good:#8FD6A0; --good-soft:#1F3424; --bad:#FF9C8F; --bad-soft:#3D1E1A; --soft:#2C271C;
  --inv-bg:#F6EFDD; --inv-fg:#17140D; --field:#1B1810; --field-line:#4A4130;
  --c1:#F6EFDD; --c2:#F4C845; --c3:#E89A3C; --c4:#A8997A; --c5:#7FA9D6; --c6:#5E5440;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
a{color:var(--amber)}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;padding:14px 20px;font-weight:700;font-size:16px;min-height:48px;text-decoration:none;text-align:center}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-brand{background:var(--brand);color:var(--on-brand)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn-text{background:none;border:none;color:var(--amber);font-weight:600;padding:8px 0;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.active{background:var(--brand-soft);color:var(--amber)}
.pill.next{background:var(--soft);color:var(--muted)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(18px,3vw,24px)}
.muted{color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.stack{display:flex;flex-direction:column}
.page-head{display:flex;flex-direction:column;gap:6px}
.page-head h1{font-size:clamp(28px,4vw,36px)}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:flex;flex-wrap:wrap}
.auth-brand{flex:1 1 380px;background:var(--brand);color:var(--on-brand);display:flex;flex-direction:column;justify-content:center;padding-block:48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.auth-brand-in{max-width:440px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.auth-brand img{width:120px;height:120px;border-radius:32px;mix-blend-mode:multiply}
.auth-brand h1{font-size:clamp(30px,4vw,44px);font-weight:800}
.auth-brand ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:17px}
.auth-brand li{display:flex;gap:10px;align-items:center}
.auth-form{flex:1 1 380px;display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth-form form,.auth-form .wrap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.auth-form h2{font-size:28px}
label{font-weight:600;font-size:14px}
.field{font-family:inherit;font-size:18px;padding:15px 16px;border-radius:14px;border:1.5px solid var(--field-line);background:var(--field);color:var(--ink);width:100%}
.field:focus{border-color:var(--amber);outline:none}
.field.otp{font-size:30px;letter-spacing:12px;text-align:center;direction:ltr}
.err{color:var(--bad);font-size:14px;font-weight:500;min-height:21px}
.demo-note{background:var(--brand-soft);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.demo-note b{font-size:18px;letter-spacing:3px;direction:ltr}
.greet{font-size:clamp(38px,6vw,52px);font-weight:800;line-height:1.1}
.welcome-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.welcome-list div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.welcome-list b{font-size:28px;font-weight:800}
.welcome-list span{font-size:13px;color:var(--muted);line-height:1.35}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.5px;background:none;border:none;padding:0}
.logo img{width:40px;height:40px;border-radius:11px}
.topnav{display:flex;gap:2px}
.topnav button{background:none;border:none;padding:10px 14px;border-radius:999px;font-weight:500;font-size:15px;min-height:44px;white-space:nowrap}
.topnav button[aria-current="page"]{background:var(--ink);color:var(--bg);font-weight:600}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center;font-weight:700;border:none;flex:none}
.user-name{line-height:1.2;text-align:left}
.user-name small{display:block;color:var(--muted);font-size:13px}
main{max-width:1180px;margin:0 auto;padding-block:24px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
.tabbar{display:none}
@media (max-width:900px){
  .topnav,.user-name{display:none}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding-top:6px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .tabbar button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);flex:1;min-width:0;padding:4px 0}
  .tabbar button span.ic{padding:4px 14px;border-radius:999px;display:flex}
  .tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}
  .tabbar button[aria-current="page"] span.ic{background:var(--brand);color:var(--on-brand)}
}

/* ---------- home ---------- */
.hero{background:var(--brand);color:var(--on-brand);border-radius:28px;padding:clamp(22px,4vw,40px);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:18px}
.hero h1{font-size:clamp(34px,5.5vw,56px);font-weight:800;position:relative;z-index:1}
.hero p{max-width:520px;font-size:17px;position:relative;z-index:1}
.hero img{position:absolute;left:-12px;bottom:-22px;width:min(210px,34%);height:auto;border-radius:36px;mix-blend-mode:multiply;opacity:.9;pointer-events:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;position:relative;z-index:1;max-width:880px}
.kpi{background:#FFFFFF;color:#2A2110;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;border:none;text-align:right}
.kpi small{font-size:13px;color:#6B5E45}
.kpi b{font-size:clamp(20px,2.6vw,26px);font-weight:800}
.kpi span{font-size:12px;color:#6B5E45}
button.kpi:hover{box-shadow:0 0 0 2px #2A2110}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hero img{display:none}}
.mirror-row{display:flex;flex-wrap:wrap;gap:20px}
.mirror-row > .card{flex:1 1 400px;min-width:0;display:flex;flex-direction:column;gap:16px}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:3px}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;font-size:14px}
.legend div{display:flex;align-items:center;gap:8px;justify-content:space-between}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend .lt{display:flex;align-items:center;gap:8px;min-width:0}
.emp-mini{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px;align-items:center}
.emp-mini small{display:block;font-size:13px;color:var(--muted)}

.track{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:8px}
.track::before{content:"";position:absolute;top:27px;right:7%;left:7%;height:4px;background:var(--line);border-radius:4px}
.track .bar{position:absolute;top:27px;right:7%;height:4px;background:var(--ink);border-radius:4px}
.station{position:relative;background:none;border:none;padding:0 0 8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border-radius:16px}
.dot{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;flex:none}
.dot.done{background:var(--ink);color:var(--brand)}
.dot.active{background:var(--brand);color:var(--on-brand);box-shadow:0 0 0 6px var(--brand-soft)}
.dot.next{background:var(--surface);color:var(--muted);border:2px solid var(--field-line)}
.dot.sm{width:44px;height:44px;font-size:16px}
.station b{font-size:15px;font-weight:600;line-height:1.3}
.station .amt{font-size:15px;font-weight:700}
@media (max-width:900px){
  .track{grid-template-columns:1fr;gap:0}
  .track::before,.track .bar{display:none}
  .station{flex-direction:row;text-align:right;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);border-radius:0}
  .station:last-child{border-bottom:none}
  .station .dot{width:44px;height:44px;font-size:16px}
  .station .st-txt{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
  .station .amt{white-space:nowrap}
}
@media (min-width:901px){.station .st-txt{display:contents}}

.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
.line-item{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:9px 0;border-top:1px solid var(--line)}
.note{background:var(--brand-soft);border-radius:14px;padding:12px 14px;font-size:14px}
.note.bad{background:var(--bad-soft)}
.note.good{background:var(--good-soft)}
.task{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.task .t-txt{flex:1;min-width:0}
.task .t-txt small{display:block;color:var(--muted);font-size:13px}
.task.ok{background:var(--good-soft);border-color:transparent}
.task.ok small{color:var(--good)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.foot{font-size:13px;color:var(--muted);text-align:center}

/* ---------- mirror pages ---------- */
.sum-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.sum-tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:2px}
.sum-tile small{font-size:13px;color:var(--muted)}
.sum-tile b{font-size:26px;font-weight:800}
.sum-tile span{font-size:13px;color:var(--muted)}
.sum-tile.hl{background:var(--inv-bg);color:var(--inv-fg);border-color:transparent}
.sum-tile.hl small,.sum-tile.hl span{color:inherit;opacity:.8}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:999px;font-weight:500;font-size:14px;min-height:44px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px;align-self:flex-start}
.seg button{border:none;background:none;padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.cat-head h2{font-size:20px;display:flex;align-items:center;gap:10px}
.cat-head i{width:12px;height:12px;border-radius:4px;display:inline-block}
.list{display:flex;flex-direction:column;gap:10px}
details.item{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
details.item[open]{border-color:var(--field-line)}
details.item summary{list-style:none;display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer}
details.item summary::-webkit-details-marker{display:none}
.item-ic{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--amber);display:flex;align-items:center;justify-content:center;flex:none}
.item-main{flex:1;min-width:0}
.item-main b{display:block;font-size:16px}
.item-main small{display:block;font-size:13px;color:var(--muted)}
.item-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:left}
.item-side b{font-size:18px;font-weight:800}
.chev{transition:transform .2s;color:var(--muted);flex:none}
details[open] .chev{transform:rotate(-90deg)}
.item-body{padding:0 18px 18px;display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--bg);border-radius:12px;padding:10px 12px}
.fact small{display:block;font-size:12px;color:var(--muted)}
.fact b{font-size:15px}
.covers{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.covers li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.covers li svg{color:var(--good);flex:none;margin-top:3px}
.covers .cv-amt{margin-inline-start:auto;font-weight:600;white-space:nowrap}
.dep{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.emp-card{display:flex;flex-direction:column;gap:12px}
.emp-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.emp-head .eh-txt{flex:1;min-width:0}
.emp-head h2{font-size:21px}
.emp-ic{width:48px;height:48px;border-radius:14px;background:var(--ink);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:flex;align-items:center;gap:10px;font-size:14px}
.barrow .lbl{width:150px;flex:none}
.barrow .trk{flex:1;height:12px;background:var(--soft);border-radius:6px;overflow:hidden;min-width:40px}
.barrow .trk div{height:100%;border-radius:6px}
.barrow b{width:96px;text-align:left;flex:none}
@media (max-width:520px){.barrow .lbl{width:100px}.barrow b{width:74px}}
.confirm{border:1.5px solid var(--ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.confirm-actions{display:flex;flex-wrap:wrap;gap:10px}
.save-box{background:var(--inv-bg);color:var(--inv-fg);border-radius:22px;padding:22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.save-box .sb-txt{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:4px}
.save-box .sb-txt small{opacity:.8;font-size:14px}
.save-box .btn{background:var(--brand);color:var(--on-brand)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:520px}
th{text-align:right;font-size:13px;color:var(--muted);font-weight:600;padding:10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line)}

/* ---------- station detail ---------- */
.detail-head{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.detail-head h1{font-size:clamp(28px,4vw,40px)}
.detail-amt{font-size:clamp(36px,6vw,56px);font-weight:800;line-height:1}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:flex;gap:14px}
.steps .rail{display:flex;flex-direction:column;align-items:center;width:28px;flex:none}
.steps .rail i{width:16px;height:16px;border-radius:50%;margin-top:4px;flex:none}
.steps .rail i.done{background:var(--good)}
.steps .rail i.active{background:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.steps .rail i.next{background:var(--surface);border:2px solid var(--field-line)}
.steps .rail span{width:2px;flex:1;background:var(--line);min-height:20px}
.steps .s-txt{padding-bottom:18px}
.steps small{display:block;color:var(--muted);font-size:13px}
.two{display:flex;flex-wrap:wrap;gap:20px}
.two > *{flex:1 1 340px;min-width:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--inv-bg);color:var(--inv-fg);padding:14px 20px;border-radius:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (min-width:901px){.toast{bottom:32px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
const DEMO_CODE = '248913';
const CLIENT = {first:'ישראל', full:'ישראל ישראלי', initial:'י'};
const fmt = n => '₪' + Number(n).toLocaleString('en-US');

const IC = {
  check:'<path d="M20 6L9 17l-5-5"/>',
  chat:'<path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"/>',
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

function loginView(){
  return `<div class="auth">${authBrand()}
  <section class="auth-form"><form id="f-email" novalidate>
    <h2>כניסה לאזור האישי</h2>
    <p class="muted">נשלח לך קוד חד־פעמי למייל. אין סיסמה לזכור.</p>
    <label for="email">כתובת אימייל</label>
    <input id="email" class="field" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" value="${S.email}" style="direction:ltr;text-align:right">
    <div class="err">${S.err}</div>
    <button class="btn btn-primary" type="submit">${icon('mail',20)} שלחו לי קוד</button>
    <p class="muted" style="font-size:13px">הגישה פתוחה ללקוחות עם מנוי פעיל. אין לך מנוי? <a href="https://bitax.co.il/" target="_blank" rel="noopener">להצטרפות</a></p>
  </form></section></div>`;
}
function codeView(){
  return `<div class="auth">${authBrand()}
  <section class="auth-form"><form id="f-code" novalidate>
    <button type="button" class="btn-text" data-act="to-login" style="align-self:flex-start">${icon('back',18)} שינוי כתובת</button>
    <h2>בדוק את המייל</h2>
    <p class="muted">שלחנו קוד בן 6 ספרות אל <b style="direction:ltr;display:inline-block;color:var(--ink)">${S.email}</b></p>
    <div class="demo-note"><span>מצב הדגמה · הקוד: <b>${DEMO_CODE}</b></span><button type="button" class="btn-text" data-act="fill-code">מילוי אוטומטי</button></div>
    <label for="otp">קוד אימות</label>
    <input id="otp" class="field otp num" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="------">
    <div class="err">${S.err}</div>
    <button class="btn btn-primary" type="submit">כניסה</button>
    <p class="muted" style="font-size:13px">הקוד בתוקף ל-10 דקות. לא הגיע? בדוק בספאם או <button type="button" class="btn-text" data-act="resend" style="padding:0;min-height:0">שלחו שוב</button></p>
  </form></section></div>`;
}
function welcomeView(){
  return `<div class="auth">${authBrand()}
  <section class="auth-form"><div class="wrap fade" style="gap:20px">
    <div class="greet">${greeting()} ${CLIENT.first},</div>
    <p style="font-size:19px">ריכזנו בשבילך את כל התיק הפיננסי במקום אחד. בפעם הראשונה תוכל לראות הכל מול העיניים.</p>
    <div class="welcome-list">
      <div><b class="num">${POLICIES.length}</b><span>פוליסות ביטוח ב-7 חברות</span></div>
      <div><b class="num">${allProducts().length}</b><span>מוצרי פנסיה וחיסכון</span></div>
      <div><b class="num">${EMPLOYERS.filter(e=>!e.self).length}</b><span>מעסיקים, כולל קודמים</span></div>
    </div>
    <div class="note">כבר מצאנו לך ${fmt(18640)} שחזרו אליך, ועוד ${fmt(INS_SAVE+PEN_SAVE)} שאפשר לחסוך כל חודש.</div>
    <button class="btn btn-brand" data-act="enter">בוא נראה</button>
  </div></section></div>`;
}

}

function trackHTML(){
  const st = stations();
  const done = st.filter(s=>s.status==='done').length;
  return `<div class="track"><div class="bar" style="width:${(done/(st.length-1))*86}%"></div>
    ${st.map((s,i)=>`<button class="station" data-act="station" data-id="${s.id}">${dot(s,i)}<span class="st-txt"><b>${s.title}</b><span class="pill ${s.status}">${s.label}</span></span><span class="amt num">${s.amount}</span></button>`).join('')}
  </div>`;
}

function tasksHTML(k){
  const t = [];
  t.push(S.insApproved
    ? `<div class="task ok">${icon('check',22,2.2)}<div class="t-txt"><b>סידור תיק הביטוח הוגש</b><small>הבקשות נשלחו לחברות הביטוח</small></div></div>`
    : `<div class="task">${icon('shield',22)}<div class="t-txt"><b>לאשר את סידור תיק הביטוח</b><small>חיסכון של ${fmt(INS_SAVE)} בחודש</small></div><button class="btn-text" data-act="nav" data-v="insurance">לאישור</button></div>`);
  t.push(S.penSubmitted
    ? `<div class="task ok">${icon('check',22,2.2)}<div class="t-txt"><b>בקשות הוזלת דמי הניהול הוגשו</b><small>נעדכן כשהתנאים החדשים ייכנסו לתוקף</small></div></div>`
    : `<div class="task">${icon('chart',22)}<div class="t-txt"><b>לקבל תנאים חדשים בפנסיה</b><small>הוזלת דמי ניהול ב-3 מוצרים</small></div><button class="btn-text" data-act="nav" data-v="pension">לפרטים</button></div>`);
  t.push(S.f106
    ? `<div class="task ok">${icon('check',22,2.2)}<div class="t-txt"><b>טופס 106 התקבל</b><small>${S.f106name}</small></div></div>`
    : `<div class="task">${icon('upload',22)}<div class="t-txt"><b>להעלות טופס 106 לשנת 2025</b><small>צילום מהטלפון מספיק</small></div><label class="btn-text file-btn" for="f106${k}">העלאה<input id="f106${k}" type="file" accept="image/*,.pdf" data-upload="106"></label></div>`);
  return t.join('');
}

      <div class="dep" aria-hidden="true"><div style="flex:${p.dep.emp};background:var(--c1)"></div>${p.dep.er?`<div style="flex:${p.dep.er};background:var(--c2)"></div>`:''}${p.dep.sev?`<div style="flex:${p.dep.sev};background:var(--c4)"></div>`:''}</div>

function pensionView(){
  const prods = allProducts();
  const byType = Object.keys(PROD_TYPES).map(t=>({t, name:PROD_TYPES[t], sum:prods.filter(p=>p.type===t).reduce((a,p)=>a+p.bal,0), list:prods.filter(p=>p.type===t)})).filter(x=>x.sum);
  const max = Math.max(...byType.map(x=>x.sum));
  const action = S.penSubmitted
    ? `<div class="task ok">${icon('check',22,2.2)}<div class="t-txt"><b>בקשות ההוזלה הוגשו ל-3 החברות</b><small>מגדל, כלל והראל · נעדכן כשהתנאים החדשים ייכנסו לתוקף</small></div></div>`

          <div class="confirm-actions"><button class="btn btn-primary" data-act="pen-yes">כן, הגישו בשבילי</button><button class="btn btn-ghost" data-act="pen-no">לא עכשיו</button></div></div>`
      : `<div class="save-box"><div class="sb-txt"><b style="font-size:20px">דמי הניהול שלך גבוהים ב-3 מוצרים</b><small>הוזלה תחסוך כ-${fmt(PEN_SAVE)} בחודש, ועשרות אלפי שקלים עד הפרישה</small></div><button class="btn" data-act="pen-ask">לקבלת התנאים החדשים והגשה לחברות</button></div>`;

  return `<section class="page-head"><h1>פנסיה וחיסכון</h1><p class="muted">כל המוצרים הפנסיוניים שלך, מכל המעסיקים, במקום אחד. מקור: המסלקה הפנסיונית, עודכן 27.10.2026.</p></section>
  <section class="sum-tiles">
    <div class="sum-tile hl"><small>סך הכל צבור</small><b class="num">${fmt(PEN_TOTAL)}</b><span>${prods.length} מוצרים</span></div>
    <div class="sum-tile"><small>מופקד כל חודש</small><b class="num">${fmt(prods.reduce((a,p)=>a+(p.dep?p.dep.emp+p.dep.er+p.dep.sev:0),0))}</b><span>ב-3 מוצרים פעילים</span></div>
    <div class="sum-tile"><small>קצבה צפויה בגיל 67</small><b class="num">${fmt(9850)}</b><span>בחודש, הערכה</span></div>
    <div class="sum-tile"><small>מוצרים לא פעילים</small><b class="num">2</b><span>ממעסיקים קודמים</span></div>
  </section>
  <section class="card stack" style="gap:14px"><h2 style="font-size:20px">לפי סוג מוצר</h2>
    <div class="bars">${byType.map(x=>`<div class="barrow"><span class="lbl">${x.name}</span><div class="trk"><div style="width:${x.sum/max*100}%;background:${TYPE_COLOR[x.t]}"></div></div><b class="num">${fmt(x.sum)}</b></div>`).join('')}</div>
  </section>

  <div class="seg" role="group" aria-label="תצוגה">

        <div class="emp-head"><span class="emp-ic">${e.self?icon('users',22):e.name.charAt(0)}</span>
          <div class="eh-txt"><h2>${e.name}</h2><span class="muted" style="font-size:14px">${e.years}${e.salary?` · שכר מבוטח ${fmt(e.salary)}`:''}</span></div>
          <div style="text-align:left"><b class="num" style="font-size:22px">${fmt(e.products.reduce((a,p)=>a+p.bal,0))}</b><div><span class="pill ${e.active?'done':'next'}">${e.self?'פרטי':e.active?'מעסיק נוכחי':'מעסיק קודם'}</span></div></div>
        </div>
        <div class="list">${e.products.map(p=>productHTML({...p, emp:e.name}, false)).join('')}</div>

  const docs = [['דוח שיקוף ביטוחי · הר הביטוח','20.10.2026'],['דוח מסלקה פנסיונית','27.10.2026'],['אישור החזר מס 2020–2024','14.09.2026'],['טופס בקשה למענק עבודה','02.10.2026'],['תלושי שכר ינואר–אוגוסט 2026','05.09.2026'],['טפסי 106 לשנים 2020–2024','28.07.2026']];
  if(S.f106) docs.unshift(['טופס 106 · 2025 ('+S.f106name+')','היום']);
  return `<section class="page-head"><h1>מסמכים</h1><p class="muted">מה שמחכה לך, ומה שכבר נמצא אצלנו.</p></section>
  <section class="two">
    <div class="card stack" style="gap:12px"><h2 style="font-size:20px">משימות</h2>${tasksHTML('b')}</div>
    <div class="card stack" style="gap:4px"><h2 style="font-size:20px;margin-bottom:8px">המסמכים שלך</h2>
      ${docs.map(d=>`<div class="line-item" style="align-items:center"><span style="display:flex;gap:10px;align-items:center;min-width:0">${icon('file',20)}${d[0]}</span><span class="muted num" style="font-size:13px;white-space:nowrap">${d[1]}</span></div>`).join('')}
    </div>
  </section>`;
}

/* ---------- station detail ---------- */
function stepsHTML(list){
  return `<ol class="steps">${list.map((s,i)=>`<li><div class="rail"><i class="${s[0]}"></i>${i<list.length-1?'<span></span>':''}</div><div class="s-txt"><b>${s[1]}</b><small>${s[2]}</small></div></li>`).join('')}</ol>`;
}
function detailFrame(s, i, body, steps){
  return `<button class="btn-text" data-act="nav" data-v="journey" style="align-self:flex-start">${icon('back',18)} חזרה למסע</button>
  <section class="detail-head"><div class="stack" style="gap:10px"><div style="display:flex;gap:12px;align-items:center">${dot(s,i)}<span class="pill ${s.status}">${s.label}</span></div><h1>${s.title}</h1></div>
  <div class="detail-amt num">${s.amount}</div></section>
  <section class="two">${body}<div class="card stack" style="gap:14px"><h2 style="font-size:20px">מה עשינו עד עכשיו</h2>${stepsHTML(steps)}</div></section>`;
}
function stationView(){
  const st = stations(); const i = st.findIndex(x=>x.id===S.station); const s = st[i];
  if(s.id==='tax') return detailFrame(s,i,`<div class="card stack" style="gap:12px"><h2 style="font-size:20px">ההחזר לפי שנים</h2>
    <div class="tbl-wrap"><table class="num"><thead><tr><th>שנת מס</th><th>סיבה עיקרית</th><th>סכום</th></tr></thead><tbody>
    <tr><td>2020</td><td>נקודות זיכוי לא נוצלו</td><td><b>${fmt(640)}</b></td></tr>
    <tr><td>2021</td><td>עבודה אצל שני מעסיקים</td><td><b>${fmt(1180)}</b></td></tr>
    <tr><td>2022</td><td>תקופת אבטלה</td><td><b>${fmt(2310)}</b></td></tr>
    <tr><td>2023</td><td>תרומות לעמותות</td><td><b>${fmt(1920)}</b></td></tr>
    <tr><td>2024</td><td>משיכה מקופת גמל</td><td><b>${fmt(1800)}</b></td></tr>
    <tr><td>2025</td><td>ממתין לטופס 106</td><td><span class="pill ${S.f106?'active':'next'}">${S.f106?'בבדיקה':'ממתין'}</span></td></tr>
    </tbody></table></div><p class="muted" style="font-size:14px">אפשר לבקש החזר עד 6 שנים אחורה.</p></div>`,
    [['done','בדקנו 6 שנות מס','מאי 2026'],['done','הגשנו בקשה למס הכנסה','יוני 2026'],['done','ההחזר אושר','אוגוסט 2026'],['done','₪7,850 הופקדו בחשבונך','14.09.2026'],[S.f106?'active':'next','בדיקת שנת 2025',S.f106?'קיבלנו את טופס 106, בודקים':'מחכה לטופס 106 ממך']]);
  if(s.id==='pay') return detailFrame(s,i,`<div class="card stack" style="gap:12px"><h2 style="font-size:20px">מה מצאנו בתלוש</h2>
    <div class="note">המעסיק לא הכניס לתלוש את נקודות הזיכוי על הילדים מאז ינואר 2026.</div>
    <div class="line-item"><span>תלושים שנבדקו</span><b>8</b></div><div class="line-item"><span>טעויות שנמצאו</span><b>1</b></div><div class="line-item"><span>החזר מהמעסיק</span><b class="num">${fmt(1200)}</b></div><div class="line-item"><span>תוספת קבועה לנטו</span><b class="num">₪150 בחודש</b></div></div>`,
    [['done','קיבלנו 8 תלושי שכר','05.09.2026'],['done','מצאנו נקודות זיכוי חסרות','08.09.2026'],['done','פנינו למחלקת השכר','10.09.2026'],['done','התיקון נכנס בתלוש ספטמבר','01.10.2026']]);
  if(s.id==='grant') return detailFrame(s,i,`<div class="card stack" style="gap:12px"><h2 style="font-size:20px">מענק עבודה לשנת 2025</h2>
    <p class="muted">מענק עבודה (מס הכנסה שלילי) מגיע לשכירים עם הכנסה עד תקרה מסוימת. בדקנו ומצאנו שאתה זכאי.</p>
    <div class="line-item"><span>סכום צפוי</span><b class="num">${fmt(3240)}</b></div><div class="line-item"><span>מועד הגשה</span><b>02.10.2026</b></div><div class="line-item"><span>תשלום צפוי</span><b>עד סוף דצמבר 2026</b></div></div>`,
    [['done','בדיקת זכאות','סוף ספטמבר 2026'],['done','הגשנו את הבקשה','02.10.2026'],['active','ממתינים לאישור רשות המסים','בדרך כלל 6–8 שבועות'],['next','הכסף בחשבון','נעדכן אותך']]);
  if(s.id==='funds') return detailFrame(s,i,`<div class="card stack" style="gap:12px"><h2 style="font-size:20px">מה מצאנו</h2>
    <div class="note">קופת גמל לא פעילה בהראל, ממעסיק קודם (רשת סופר־כל, 2016–2018). הכסף שלך, ולא ידעת שהוא קיים.</div>
    <div class="line-item"><span>יתרה</span><b class="num">${fmt(6350)}</b></div><div class="line-item"><span>מה עושים</span><b>מאחדים לקרן הפעילה</b></div>
    <button class="btn btn-ghost" data-act="nav" data-v="pension">לשיקוף הפנסיוני</button></div>`,
    [['done','חיפשנו בהר הכסף ובמסלקה','אוגוסט 2026'],['done','נמצאה קופת גמל','₪6,350'],['active','איחוד לקרן הפנסיה','יחד עם הוזלת דמי הניהול']]);
  if(s.id==='ins') return detailFrame(s,i,`<div class="card stack" style="gap:12px"><h2 style="font-size:20px">מה מצאנו בתיק הביטוח</h2>
    <div class="line-item"><span>ביטוח בריאות כפול · הפניקס</span><b class="num">₪168-</b></div><div class="line-item"><span>תאונות אישיות מיותר · מנורה</span><b class="num">₪58-</b></div><div class="line-item"><span>הוזלת ריסק · מגדל</span><b class="num">₪60-</b></div>
    <button class="btn btn-primary" data-act="nav" data-v="insurance">${S.insApproved?'לכל הביטוחים':'לפרטים ואישור'}</button></div>`,
    [['done','קיבלנו נתונים מהר הביטוח','20.10.2026'],['done','בדקנו כפלים וכיסויים','22.10.2026'],[S.insApproved?'done':'active','האישור שלך',S.insApproved?'אושר':'מחכה לך'],[S.insApproved?'active':'next','ביטול והוזלה מול החברות','עד 14 ימי עסקים']]);
  if(s.id==='pen') return detailFrame(s,i,`<div class="card stack" style="gap:12px"><h2 style="font-size:20px">מה מצאנו בפנסיה</h2>
    ${allProducts().filter(p=>p.feeBad).map(p=>`<div class="line-item"><span>${PROD_TYPES[p.type]} · ${p.co}</span><b class="num">${p.fee}</b></div>`).join('')}
    <button class="btn btn-primary" data-act="nav" data-v="pension">${S.penSubmitted?'לשיקוף הפנסיוני':'לקבלת התנאים החדשים'}</button></div>`,
    [['done','קיבלנו נתונים מהמסלקה הפנסיונית','27.10.2026'],['done','השווינו דמי ניהול ומסלולים','28.10.2026'],[S.penSubmitted?'done':'active','האישור שלך',S.penSubmitted?'אושר':'מחכה לך'],[S.penSubmitted?'active':'next','הגשת ההוזלות לחברות','עד 10 ימי עסקים'],['next','איחוד קופות לא פעילות','נעדכן']]);
  return detailFrame(s,i,`<div class="card stack" style="gap:14px"><h2 style="font-size:20px">ביטוח רכב ונסיעות לחו״ל</h2>
    <p class="muted">ביטוח הרכב שלך מתחדש ב-03/2027. חודש לפני נשווה עבורך הצעות ונשלח לך את הטובה ביותר.</p>
    ${S.carRequested?`<div class="task ok">${icon('check',22,2.2)}<div class="t-txt"><b>קיבלנו. נחזור אליך עם הצעות</b><small>בדרך כלל תוך 2 ימי עסקים</small></div></div>`:`<button class="btn btn-ghost" data-act="car">טס בקרוב? בקש הצעה לביטוח נסיעות</button>`}</div>`,
    [['next','השוואת ביטוח רכב','פברואר 2027'],['next','ביטוח נסיעות','לפי בקשה']]);
}

/* ---------- render + events ---------- */
function render(){
  const app = document.getElementById('app');
  if(S.screen==='login') app.innerHTML = loginView();
  else if(S.screen==='code') app.innerHTML = codeView();
  else if(S.screen==='welcome') app.innerHTML = welcomeView();
  else {
    const v = {home:homeView, insurance:insuranceView, pension:pensionView, journey:journeyView, docs:docsView, station:stationView}[S.view];
    app.innerHTML = shell(v());
  }
  const f = app.querySelector('#email,#otp'); if(f && !S.err) f.focus({preventScroll:true});
}

document.addEventListener('submit', e=>{
  e.preventDefault();
  if(e.target.id==='f-email'){
    const v = document.getElementById('email').value.trim();
    S.email = v;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ S.err = 'הכתובת לא נראית תקינה. בדוק שיש בה @ ונקודה.'; render(); return; }
    go({screen:'code', err:''});
  }
  if(e.target.id==='f-code'){
    const v = document.getElementById('otp').value.trim();
    if(v !== DEMO_CODE){ S.err = v.length<6 ? 'הקוד צריך להכיל 6 ספרות.' : 'הקוד שגוי. נסה שוב או בקש קוד חדש.'; render(); return; }
    go({screen:'welcome', err:''});
  }
});
document.addEventListener('input', e=>{ if(e.target.id==='otp') e.target.value = e.target.value.replace(/\D/g,'').slice(0,6); });
document.addEventListener('change', e=>{
  if(e.target.dataset.upload==='106' && e.target.files[0]){
    S.f106 = true; S.f106name = e.target.files[0].name; render(); toast('טופס 106 התקבל. נבדוק ונעדכן אותך');
  }
});
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a==='to-login') go({screen:'login', err:''});
  else if(a==='fill-code'){ const o=document.getElementById('otp'); o.value=DEMO_CODE; o.focus(); }
  else if(a==='resend'){ toast('שלחנו קוד חדש אל '+S.email); }
  else if(a==='enter') go({screen:'app', view:'home'});
  else if(a==='nav') go({view:b.dataset.v});
  else if(a==='station') go({view:'station', station:b.dataset.id});
  else if(a==='logout') go({screen:'welcome', view:'home'});
  else if(a==='ins-filter'){ S.insFilter=b.dataset.v; render(); }
  else if(a==='pen-mode'){ S.penMode=b.dataset.v; render(); }
  else if(a==='ins-ask'){ S.insConfirm=true; render(); }
  else if(a==='ins-no'){ S.insConfirm=false; render(); }
  else if(a==='ins-yes'){ S.insApproved=true; S.insConfirm=false; render(); toast('מעולה! הגשנו את הבקשות לחברות הביטוח'); }
  else if(a==='pen-ask'){ S.penConfirm=true; render(); }
  else if(a==='pen-no'){ S.penConfirm=false; render(); }
  else if(a==='pen-yes'){ S.penSubmitted=true; S.penConfirm=false; render(); toast('הגשנו את בקשות ההוזלה ל-3 החברות'); }
  else if(a==='car'){ S.carRequested=true; render(); toast('הבקשה נשלחה לאבי'); }
});
render();
</script>

</body>
</html>
