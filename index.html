<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bitax אזור אישי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one calm app column (max 720px). One big number per screen, plain rows, details only in a bottom sheet. */
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --line:#ECE7DA; --ink:#1F1A10; --muted:#6E6656;
  --brand:#F4C845; --on-brand:#1F1A10; --brand-soft:#FFF4D1; --amber:#8A5A00;
  --good:#2D6A35; --good-soft:#E6F2E4; --warn-soft:#FFF4D1;
  --dark:#1F1A10; --on-dark:#FFFFFF; --on-dark-muted:#D9D2C2;
  --c1:#1F1A10; --c2:#F4C845; --c3:#B86E00; --c4:#9C8C68; --c5:#4E7CA8;
  --shadow:0 1px 2px rgba(31,26,16,.04), 0 6px 20px rgba(31,26,16,.06);
  --font:"Rubik","Arial Hebrew","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13110C; --surface:#1E1B14; --line:#2F2A20; --ink:#F5F0E3; --muted:#B5AC97;
  --brand:#F4C845; --on-brand:#1F1A10; --brand-soft:#352C14; --amber:#F4C845;
  --good:#8FD6A0; --good-soft:#1C3021; --warn-soft:#352C14;
  --dark:#F5F0E3; --on-dark:#13110C; --on-dark-muted:#4A4332;
  --c1:#F5F0E3; --c2:#F4C845; --c3:#E89A3C; --c4:#A8997A; --c5:#7FA9D6;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13110C; --surface:#1E1B14; --line:#2F2A20; --ink:#F5F0E3; --muted:#B5AC97;
  --brand:#F4C845; --on-brand:#1F1A10; --brand-soft:#352C14; --amber:#F4C845;
  --good:#8FD6A0; --good-soft:#1C3021; --warn-soft:#352C14;
  --dark:#F5F0E3; --on-dark:#13110C; --on-dark-muted:#4A4332;
  --c1:#F5F0E3; --c2:#F4C845; --c3:#E89A3C; --c4:#A8997A; --c5:#7FA9D6;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;direction:rtl;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:12px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:.5px}
.back{width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;flex:none;margin-inline-end:4px;animation:fadein .2s ease}
.back:hover{background:var(--brand);color:var(--on-brand)}
.logo img{width:36px;height:36px;border-radius:50%}
.topnav{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.topnav button{padding:9px 16px;border-radius:999px;font-weight:500;font-size:15px;min-height:40px;color:var(--muted)}
.topnav button[aria-current="page"]{background:var(--ink);color:var(--bg);font-weight:600}
.avatar{width:40px;height:40px;font-size:18px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
main{max-width:720px;margin:0 auto;padding-block:8px 120px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.tabbar{display:none}
@media (max-width:760px){
  .topnav{display:none}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-top:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);min-height:48px}
  .tabbar button[aria-current="page"]{color:var(--ink);font-weight:600}
  .tabbar button[aria-current="page"] .ic{background:var(--brand);color:var(--on-brand)}
  .tabbar .ic{padding:4px 18px;border-radius:999px;display:flex}
}

/* ---------- building blocks ---------- */
.card{background:var(--surface);border-radius:28px;padding:22px;box-shadow:var(--shadow)}
.label{font-size:14px;color:var(--muted);font-weight:500}
.big{font-size:clamp(40px,10vw,56px);font-weight:700;line-height:1.05;letter-spacing:-1px}
.mid{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.5px}
.page-title{padding-top:8px;display:flex;flex-direction:column;gap:4px}
.page-title h1{font-size:15px;font-weight:500;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:16px 24px;font-weight:600;font-size:17px;min-height:56px;width:100%}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-brand{background:var(--brand);color:var(--on-brand)}
.btn-soft{background:var(--bg);color:var(--ink)}
.rows{background:var(--surface);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
.rows-title{font-size:14px;color:var(--muted);font-weight:500;padding:18px 22px 4px}
.r{display:flex;align-items:center;gap:14px;width:100%;padding:16px 22px;text-align:right;min-height:72px}
.r + .r{border-top:1px solid var(--line)}
button.r:hover{background:color-mix(in srgb,var(--bg) 60%,var(--surface))}
.r-ic{width:44px;height:44px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.r-main{flex:1;min-width:0;display:flex;flex-direction:column}
.r-main b{font-weight:600;font-size:16px}
.r-main small{font-size:14px;color:var(--muted)}
.r-end{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.r-end b{font-weight:600;font-size:16px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.save{background:var(--warn-soft);color:var(--amber)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.chev{color:var(--muted);flex:none}

/* ---------- home ---------- */
.hello{background:var(--brand);color:var(--on-brand);border-radius:32px;padding:24px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative;overflow:hidden}
.hello::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#FFFFFF;opacity:.2;top:-110px;right:-70px;pointer-events:none}
.hello h1{font-size:clamp(28px,7vw,40px);font-weight:700;letter-spacing:-.5px;position:relative;min-width:0}
.ball{width:60px;height:60px;border-radius:50%;background:#FFFFFF;box-shadow:0 8px 20px rgba(138,90,0,.28);overflow:hidden;flex:none;animation:roll 4.2s cubic-bezier(.45,.05,.35,1) .6s infinite}
.ball img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply;display:block}
@keyframes roll{0%{transform:translateX(0) rotate(0)}30%{transform:translateX(-36px) rotate(-360deg)}55%{transform:translateX(0) rotate(0)}62%{transform:scale(1.08)}68%,100%{transform:none}}
.save-card{background:var(--dark);color:var(--on-dark);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:16px}
.save-card .label{color:var(--on-dark-muted)}
.save-card .btn{background:var(--brand);color:var(--on-brand)}
.save-card.done{background:var(--good-soft);color:var(--ink)}
.save-card.done .label{color:var(--good)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border-radius:28px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;text-align:right;min-height:150px}
.tile .t-ic{width:40px;height:40px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;margin-bottom:auto}
.tile .mid{font-size:24px}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;gap:14px}
.tile.wide .t-ic{margin:0}
.ask{display:flex;align-items:center;gap:12px;padding:6px 4px;color:var(--muted);font-size:15px}
.ask a{color:var(--ink);font-weight:600;text-decoration:none;background:var(--surface);padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);margin-inline-start:auto;min-height:44px;display:inline-flex;align-items:center;gap:8px}

/* ---------- money split ---------- */
.split{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:3px;margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:14px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%}

/* ---------- steps ---------- */
.step-ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.step-ic.done{background:var(--good-soft);color:var(--good)}
.step-ic.now{background:var(--brand);color:var(--on-brand)}
.step-ic.later{background:var(--bg);color:var(--muted)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(15,12,6,.45);display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s ease}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:32px 32px 0 0;padding:12px 24px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:761px){.scrim{align-items:center}.sheet{border-radius:32px;padding-bottom:24px}}
.grab{width:40px;height:5px;border-radius:999px;background:var(--line);align-self:center}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.x{width:44px;height:44px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{background:var(--bg);border-radius:20px;padding:14px 16px}
.fact small{display:block;font-size:13px;color:var(--muted)}
.fact b{font-size:18px;font-weight:600}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.list li{display:flex;gap:10px;align-items:flex-start}
.list li svg{color:var(--good);flex:none;margin-top:3px}
.hint{background:var(--warn-soft);border-radius:20px;padding:14px 16px;font-size:15px}
.hint.ok{background:var(--good-soft)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- success ---------- */
.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:32px 8px}
.success .ok-ic{width:88px;height:88px;border-radius:50%;background:var(--good-soft);color:var(--good);display:flex;align-items:center;justify-content:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:999px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
@media (min-width:761px){.toast{bottom:32px}}
.file-input{position:absolute;inset:0;opacity:0;cursor:pointer}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-top:8px}
.fade{animation:fadein .3s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

function insurance(){
  return `<section class="page-title"><h1>ביטוחים</h1><div class="big num">${fmt(INS_TOTAL)}</div><span class="muted">בחודש, על ${POLICIES.length} ביטוחים</span></section>
  <section class="rows">${POLICIES.map(p=>`<button class="r" data-sheet="ins:${p.id}">
    <span class="r-ic">${icon(p.ic,20)}</span>
    <span class="r-main"><b>${p.name}</b><small>${p.co}</small></span>
    <span class="r-end"><b class="num">${fmt(p.price)}</b>${p.save&&!S.submitted?`<span class="tag save">אפשר לחסוך</span>`:''}</span>
    <span class="chev">${icon('chev',18)}</span></button>`).join('')}</section>
  ${S.submitted?'':`<button class="btn btn-dark" data-go="save">לחסוך ${fmt(SAVE_TOTAL)} בחודש</button>`}
  <p class="foot">הנתונים לדוגמה · מקור: הר הביטוח</p>`;
}

function pension(){
  const byEmp = [...new Set(FUNDS.map(f=>f.emp))];
  const colors = ['var(--c1)','var(--c3)','var(--c4)','var(--c5)'];
  return `<section class="page-title"><h1>פנסיה וחיסכון</h1><div class="big num">${fmt(PEN_TOTAL)}</div><span class="muted">כל הכסף שלך, מכל העבודות</span>
    <div class="split" aria-hidden="true">${byEmp.map((e,i)=>`<i style="flex:${FUNDS.filter(f=>f.emp===e).reduce((a,f)=>a+f.bal,0)};background:${colors[i]}"></i>`).join('')}</div>
    <div class="legend">${byEmp.map((e,i)=>`<span><i style="background:${colors[i]}"></i>${e}</span>`).join('')}</div>
  </section>
  ${byEmp.map(e=>{const list=FUNDS.filter(f=>f.emp===e);return `<section class="rows"><div class="rows-title">${e}${list[0].current?' · העבודה הנוכחית':''}</div>
    ${list.map(f=>`<button class="r" data-sheet="pen:${f.id}">
      <span class="r-ic">${icon(f.name==='פנסיה'?'growth':'coins',20)}</span>
      <span class="r-main"><b>${f.name}</b><small>${f.co}</small></span>
      <span class="r-end"><b class="num">${fmt(f.bal)}</b>${f.found?`<span class="tag ok">מצאנו לך</span>`:f.feeHigh&&!S.submitted?`<span class="tag save">אפשר לחסוך</span>`:''}</span>
      <span class="chev">${icon('chev',18)}</span></button>`).join('')}</section>`}).join('')}
  ${S.submitted?'':`<button class="btn btn-dark" data-go="save">לחסוך ${fmt(SAVE_TOTAL)} בחודש</button>`}
  <p class="foot">הנתונים לדוגמה · מקור: המסלקה הפנסיונית</p>`;
}

function journey(){
  const done = STEPS.filter(s=>s.s==='done').length;
  return `<section class="page-title"><h1>התהליך שלך</h1><div class="big num">${done} מתוך ${STEPS.length}</div><span class="muted">שלבים שסיימנו בשבילך</span>
    <div class="split" aria-hidden="true">${STEPS.map(s=>`<i style="flex:1;background:${s.s==='done'?'var(--ink)':s.s==='now'?'var(--brand)':'var(--line)'}"></i>`).join('')}</div></section>
  <section class="rows">${STEPS.map(s=>{const st = (s.t==='ביטוחים'||s.t==='פנסיה')&&S.submitted?'done':s.s;return `<div class="r">
    <span class="step-ic ${st}">${icon(st==='done'?'check':st==='now'?'bolt':'clock',20,st==='done'?2.4:1.9)}</span>
    <span class="r-main"><b>${s.t}</b><small>${st==='done'&&s.s!=='done'?'הוגש לחברות':s.d}</small></span>
    <span class="tag ${st==='done'?'ok':st==='now'?'save':''}" style="${st==='later'?'color:var(--muted)':''}">${st==='done'?'בוצע':st==='now'?'עכשיו':'בהמשך'}</span></div>`}).join('')}</section>
  <div class="card" style="display:flex;align-items:center;gap:14px"><span class="r-ic" style="background:var(--brand-soft);color:var(--amber)">${icon('gift',20)}</span><span style="flex:1"><span class="label" style="display:block">כבר חזר אליך</span><span class="mid num">${fmt(RETURNED)}</span></span></div>`;
}

function save(){
  if(S.submitted) return `<section class="success"><span class="ok-ic">${icon('check',44,2.6)}</span><h1 style="font-size:28px">הגשנו בשבילך</h1><p class="muted" style="max-width:340px">שלחנו את כל הבקשות לחברות. נעדכן אותך בוואטסאפ ברגע שהחיסכון ייכנס לתוקף.</p><div class="big num" style="margin-top:8px">${fmt(SAVE_TOTAL)}</div><span class="muted">חיסכון בכל חודש · ${fmt(SAVE_TOTAL*12)} בשנה</span><button class="btn btn-soft" data-go="home" style="margin-top:16px;max-width:320px">חזרה לבית</button></section>`;
  return `<section class="page-title"><h1>החיסכון שלך</h1><div class="big num">${fmt(SAVE_TOTAL)}<span style="font-size:20px;font-weight:500"> בחודש</span></div><span class="muted">${fmt(SAVE_TOTAL*12)} בשנה. בלי לוותר על שום כיסוי חשוב.</span></section>
  <section class="rows">${SAVE_ITEMS.map(x=>`<div class="r"><span class="r-ic" style="background:var(--good-soft);color:var(--good)">${icon('check',20,2.4)}</span><span class="r-main"><b>${x.t}</b><small>${x.d}</small></span><b class="num" style="color:var(--good)">${fmt(x.v)}</b></div>`).join('')}</section>
  <button class="btn btn-brand" data-act="submit">אשר, ואנחנו נגיש לחברות</button>
  <p class="foot" style="font-size:14px">אנחנו מטפלים בכל מול החברות. אתה לא צריך לעשות שום דבר נוסף.</p>`;
}

/* ---------- sheet ---------- */
function sheetHTML(key){
  const [kind,id] = key.split(':');
  if(kind==='ins'){
    const p = POLICIES.find(x=>x.id===id);
    return `<div class="sheet-head"><div><span class="label">${p.co}</span><h2 style="font-size:26px">${p.name}</h2></div><button class="x" data-close aria-label="סגירה">${icon('x',20)}</button></div>
      <p style="font-size:17px">${p.what}</p>
      <div class="facts"><div class="fact"><small>בחודש</small><b class="num">${fmt(p.price)}</b></div><div class="fact"><small>מי מבוטח</small><b>${p.who}</b></div></div>
      <div><span class="label">מה מכוסה</span><ul class="list" style="margin-top:10px">${p.covers.map(c=>`<li>${icon('check',18,2.4)}<span>${c}</span></li>`).join('')}</ul></div>
      ${p.save?`<div class="hint">${S.submitted?'הגשנו את השינוי לחברה.':p.why}</div>${S.submitted?'':`<button class="btn btn-dark" data-act="sheet-save">לחסוך ${fmt(p.save)} בחודש</button>`}`:`<div class="hint ok">הביטוח הזה בסדר. כדאי להשאיר אותו.</div>`}`;
  }
  const f = FUNDS.find(x=>x.id===id);
  return `<div class="sheet-head"><div><span class="label">${f.co} · ${f.emp}</span><h2 style="font-size:26px">${f.name}</h2></div><button class="x" data-close aria-label="סגירה">${icon('x',20)}</button></div>
    <p style="font-size:17px">${f.what}</p>
    <div class="facts"><div class="fact"><small>יש בה היום</small><b class="num">${fmt(f.bal)}</b></div><div class="fact"><small>נכנס כל חודש</small><b class="num">${f.monthly?fmt(f.monthly):'לא מפקידים'}</b></div><div class="fact" style="grid-column:1/-1"><small>העמלה שהקרן לוקחת</small><b>${f.fee}</b></div></div>
    ${f.feeHigh?`<div class="hint">${S.submitted?'הגשנו בקשה להורדת העמלה.':f.more}</div>${S.submitted?'':`<button class="btn btn-dark" data-act="sheet-save">לחסוך ${fmt(f.save)} בחודש</button>`}`:f.more?`<div class="hint ok">${f.more}</div>`:''}`;
}
function openSheet(key){
  S.sheet=key; const root=document.getElementById('sheet-root');
  root.innerHTML=`<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true"><span class="grab" aria-hidden="true"></span>${sheetHTML(key)}</div></div>`;
  root.querySelector('.x').focus();
}
function closeSheet(){S.sheet=null;document.getElementById('sheet-root').innerHTML='';}

/* ---------- render + events ---------- */
function render(){
  const v={home,insurance,pension,journey,save}[S.view];
  document.getElementById('app').innerHTML = shell(v());
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){closeSheet();go(g.dataset.go);return;}
  const sh=e.target.closest('[data-sheet]'); if(sh){openSheet(sh.dataset.sheet);return;}
  if(e.target.closest('[data-act="back"]')){back();return;}
  if(e.target.closest('[data-act="sheet-save"]')){closeSheet();go('save');return;}
  if(e.target.closest('[data-act="submit"]')){S.submitted=true;render();window.scrollTo({top:0});return;}
  if(e.target.matches('[data-close]')||e.target.closest('.x')){closeSheet();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet();});
document.addEventListener('change',e=>{if(e.target.id==='f106'&&e.target.files[0]){S.f106=true;render();toast('קיבלנו, תודה! נבדוק אם מגיע לך עוד החזר');}});
