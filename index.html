<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6DE">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bitax אזור אישי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&family=Heebo:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: one calm app column (max 720px). One big number per screen, plain rows, details only in a bottom sheet. */
:root{
  --bg:#FCFBF8; --surface:#FFFFFF; --line:#EFECE6; --ink:#222222; --muted:#6B6B6B;
  --brand:#F6D46A; --on-brand:#222222; --brand-soft:#FFF8E1; --amber:#8A6400;
  --good:#8A6400; --good-soft:#FFF5D9; --warn-soft:#FFF5D9;
  --dark:#222222; --on-dark:#FFFFFF; --on-dark-muted:#D9D9D9;
  --hello-a:#FFF3C9; --hello-b:#FBE3A0; --glow:#FFF6DE;
  --save-bg:#FFF7DF; --save-fg:#222222; --save-muted:#6B6B6B; --save-btn:#222222; --save-btn-fg:#FFFFFF;
  --c1:#3A3A3A; --c2:#F6D46A; --c3:#E7A94B; --c4:#B9AE95; --c5:#8FB3D9;
  --shadow:0 1px 2px rgba(20,20,40,.03), 0 8px 24px rgba(20,20,40,.05);
  --stork-filter:none;
  --wa-bg:#EAF6EE; --wa-fg:#1E6B3C; --wa-line:#D3ECDB;
  --font:"Heebo","Arial Hebrew","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13110C; --surface:#1E1B14; --line:#2F2A20; --ink:#F5F0E3; --muted:#B5AC97;
  --brand:#F4C845; --on-brand:#1F1A10; --brand-soft:#352C14; --amber:#F4C845;
  --good:#F4C845; --good-soft:#352C14; --warn-soft:#352C14;
  --dark:#F5F0E3; --on-dark:#13110C; --on-dark-muted:#4A4332;
  --c1:#F5F0E3; --c2:#F4C845; --c3:#E89A3C; --c4:#A8997A; --c5:#7FA9D6;
  --hello-a:#3A3018; --hello-b:#2E2612; --glow:#1A170F;
  --save-bg:#2A2414; --save-fg:#F5F0E3; --save-muted:#B5AC97; --save-btn:#F4C845; --save-btn-fg:#1F1A10;
  --stork-filter:invert(1);
  --wa-bg:#16291D; --wa-fg:#8FD6A0; --wa-line:#21402C;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13110C; --surface:#1E1B14; --line:#2F2A20; --ink:#F5F0E3; --muted:#B5AC97;
  --brand:#F4C845; --on-brand:#1F1A10; --brand-soft:#352C14; --amber:#F4C845;
  --good:#F4C845; --good-soft:#352C14; --warn-soft:#352C14;
  --dark:#F5F0E3; --on-dark:#13110C; --on-dark-muted:#4A4332;
  --c1:#F5F0E3; --c2:#F4C845; --c3:#E89A3C; --c4:#A8997A; --c5:#7FA9D6;
  --hello-a:#3A3018; --hello-b:#2E2612; --glow:#1A170F;
  --save-bg:#2A2414; --save-fg:#F5F0E3; --save-muted:#B5AC97; --save-btn:#F4C845; --save-btn-fg:#1F1A10;
  --stork-filter:invert(1);
  --wa-bg:#16291D; --wa-fg:#8FD6A0; --wa-line:#21402C;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{background:linear-gradient(180deg,var(--glow) 0,var(--bg) 420px) no-repeat,var(--bg);color:var(--ink);font-weight:400;font-family:var(--font);font-size:16px;line-height:1.5;direction:rtl;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:12px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:24px;letter-spacing:.5px}
.back{width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;flex:none;margin-inline-end:4px;animation:fadein .2s ease}
.back:hover{background:var(--brand);color:var(--on-brand)}
.logo img{height:44px;width:auto;display:block}
.stork{filter:var(--stork-filter)}
.topnav{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.topnav button{padding:9px 16px;border-radius:999px;font-weight:500;font-size:15px;min-height:40px;color:var(--muted)}
.topnav button[aria-current="page"]{background:var(--ink);color:var(--bg);font-weight:600}
.hdr-start{min-width:44px;display:flex}
.logo span{order:0}.logo img{order:1}
main{max-width:720px;margin:0 auto;padding-block:8px 120px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.tabbar{display:none}
@media (max-width:760px){
  .topnav{display:none}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-top:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);min-height:48px}
  .tabbar button[aria-current="page"]{color:var(--ink);font-weight:600}
  .tabbar button[aria-current="page"] .ic{background:var(--brand);color:var(--on-brand)}
  .tabbar .ic{padding:4px 18px;border-radius:999px;display:flex}
}

/* ---------- building blocks ---------- */
.card{background:var(--surface);border-radius:28px;border:1px solid var(--line);padding:22px;box-shadow:var(--shadow)}
.label{font-size:14px;color:var(--muted);font-weight:500}
.big{font-size:clamp(40px,10vw,54px);font-weight:600;line-height:1.05;letter-spacing:-1px}
.mid{font-size:30px;font-weight:600;line-height:1.1;letter-spacing:-.5px}
.page-title{padding-top:8px;display:flex;flex-direction:column;gap:4px}
.page-title h1{font-size:15px;font-weight:500;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:16px 24px;font-weight:500;font-size:17px;min-height:56px;width:100%}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-brand{background:var(--ink);color:var(--surface);box-shadow:0 8px 16px rgba(0,0,0,.14)}
.btn-soft{background:var(--bg);color:var(--ink)}
.rows{background:var(--surface);border-radius:28px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.rows-title{font-size:14px;color:var(--muted);font-weight:500;padding:18px 22px 4px}
.r{display:flex;align-items:center;gap:14px;width:100%;padding:16px 22px;text-align:right;min-height:72px}
.r + .r{border-top:1px solid var(--line)}
button.r:hover{background:color-mix(in srgb,var(--bg) 60%,var(--surface))}
.r-ic{width:44px;height:44px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.r-main{flex:1;min-width:0;display:flex;flex-direction:column}
.r-main b{font-weight:500;font-size:16px}
.r-main small{font-size:14px;color:var(--muted)}
.r-end{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.r-end b{font-weight:600;font-size:16px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.save{background:var(--warn-soft);color:var(--amber)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.chev{color:var(--muted);flex:none}

/* ---------- home ---------- */
.hello{background:linear-gradient(120deg,var(--hello-a),var(--hello-b));color:var(--on-brand);border-radius:32px;padding:22px 24px 22px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:relative;overflow:hidden}
.hello::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#FFFFFF;opacity:.35;top:-110px;right:-70px;pointer-events:none}
.hello h1{font-size:clamp(28px,7vw,38px);font-weight:600;letter-spacing:-.5px;position:relative;min-width:0}
.ball{height:64px;flex:none;position:relative;display:flex;align-items:center}
.ball.roll{animation:rollin 1.2s cubic-bezier(.2,.8,.2,1) .25s both}
.ball img{height:100%;width:auto;display:block}
@keyframes rollin{0%{transform:translateX(120px) rotate(360deg);opacity:0}25%{opacity:1}100%{transform:none}}
.save-card{background:var(--save-bg);color:var(--save-fg);border:1px solid var(--line);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:16px}
.save-card .label{color:var(--save-muted)}
.save-card .btn{background:var(--save-btn);color:var(--save-btn-fg)}
.save-card.done{background:var(--good-soft);color:var(--ink)}
.save-card.done .label{color:var(--good)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border-radius:28px;border:1px solid var(--line);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;text-align:right;min-height:150px}
.tile .t-ic{width:40px;height:40px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;margin-bottom:auto}
.tile .mid{font-size:24px}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;gap:14px}
.tile.wide .t-ic{margin:0}
.ask{display:flex;align-items:center;gap:12px;padding:6px 4px;color:var(--muted);font-size:15px}
.ask a{color:var(--ink);font-weight:600;text-decoration:none;background:var(--surface);padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);margin-inline-start:auto;min-height:44px;display:inline-flex;align-items:center;gap:8px}

.sav2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sav2 > div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.sav2 .big{font-size:clamp(32px,8vw,48px)}
.success .sav2{text-align:center}
.good{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.good-i{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.good-i .r-ic{margin-bottom:6px}
.good-i b{font-weight:500}
.good-i small{font-size:13px;color:var(--muted);line-height:1.4}
.cov{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:6px 10px 12px;gap:2px}
.cov-i{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;text-align:right;min-height:56px}
.cov-i:hover{background:var(--bg)}
.cov-i .r-ic{width:36px;height:36px}
.cov-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.cov-t b{font-weight:500;font-size:15px}
.cov-t small{font-size:12px;color:var(--muted)}
.cov-p{font-size:14px;font-weight:500}
@media (max-width:420px){.cov{grid-template-columns:1fr}}
.types{display:flex;flex-direction:column;margin-top:10px}
.type-r{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.type-r:first-child{border-top:none}
.type-n{display:flex;align-items:center;gap:8px;color:var(--muted)}
.type-n i{width:8px;height:8px;border-radius:50%}
.type-r b{font-weight:500}
.plan-cta{display:flex;align-items:center;gap:14px;width:100%;font:inherit;color:inherit;cursor:pointer}
.ask a.wa{background:var(--wa-bg);color:var(--wa-fg);box-shadow:none;border:1px solid var(--wa-line)}
.plan-form{display:flex;flex-direction:column;gap:14px}
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:var(--bg);border-radius:999px;padding:4px}
.choice label{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{width:100%;font:inherit;font-size:17px;padding:15px 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.field:focus{outline:none;border-color:var(--amber)}
.err{color:#A3271D;font-size:14px;min-height:20px}
.tagline{margin:4px 0 0;font-size:15px;font-weight:400;opacity:.75}
.dd{border-top:1px solid var(--line)}
.dd:first-child{border-top:none}
.dd summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 0;cursor:pointer;min-height:48px}
.dd summary::-webkit-details-marker{display:none}
.dd summary .type-n{flex:1}
.dd summary small{font-size:12px;color:var(--muted)}
.dd summary b{font-weight:500}
.dd-chev{color:var(--muted);transition:transform .2s;display:flex;transform:rotate(-90deg)}
.dd[open] .dd-chev{transform:rotate(90deg)}
.dd-body{display:flex;flex-direction:column;gap:6px;padding:0 0 12px}
.dd-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg);border-radius:16px;padding:10px 14px;text-align:right;min-height:52px}
.dd-row b{font-weight:500;display:block;font-size:15px}
.dd-row small{font-size:12px;color:var(--muted)}
.dd-row .num{font-weight:500}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--amber)}
.status.off{background:var(--bg);color:var(--muted)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.lg{min-height:100vh;max-width:460px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:14px;padding-block:28px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.lg-brand{display:flex;align-items:flex-end;justify-content:center;gap:8px;font-weight:700;font-size:30px;line-height:.74;letter-spacing:.5px}
.lg-brand img{height:52px}
.lg-brand .word{display:block;line-height:.74}
.lg-brand .dot{font-weight:800;font-size:1.15em;margin-inline-start:1px}
.lg-tag{text-align:center;color:var(--muted);margin:0 0 6px;font-size:14px}
.lg-card{display:flex;flex-direction:column;gap:10px;padding:26px}
.lg-card h1{font-size:24px;font-weight:600}
/* login: tighter and squarer */
.lg-card{border-radius:18px;gap:6px;padding:22px}
.lg-card h1{margin-bottom:8px}
.lg-card .label{margin-top:8px}
.lg-card .field{border-radius:12px;padding:12px 14px}
.lg-card .btn{border-radius:12px;min-height:50px;margin-top:12px}
.lg-card .choice{border-radius:12px}
.lg-card .choice label{border-radius:9px}
.lg-card .err:empty{display:none}
.field.otp{font-size:28px;letter-spacing:12px;text-align:center;direction:ltr}
.link-btn{background:none;border:none;color:var(--amber);font-weight:500;display:inline-flex;align-items:center;gap:6px;padding:6px 0;min-height:40px;align-self:flex-start;cursor:pointer}
.out{background:none;border:none;color:var(--muted);font-size:14px;padding:8px 4px;min-height:44px;cursor:pointer}
.plan-foot{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.pf-head{display:flex;gap:14px;align-items:flex-start}
.pf-head b{display:block;font-weight:500;font-size:17px}
.pf-head small{display:block;color:var(--muted);font-size:14px;line-height:1.45}
.pf-actions{display:flex;flex-direction:column;gap:10px}
.pf-actions a.btn{text-decoration:none}
.pf-mail{display:flex;gap:8px}
.pf-mail .field{flex:1;min-width:0}
.pf-mail .btn{width:auto;flex:none;padding-inline:20px}
.logo-block{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.logo-block .brand{display:flex;align-items:flex-end;gap:6px;font-weight:700;letter-spacing:.5px;font-size:24px;line-height:1}
.logo-block .brand .word{display:block;line-height:.74}
.logo-block .brand .dot{color:var(--ink);font-weight:800;font-size:1.15em;margin-inline-start:1px}
.logo-block .brand img{height:38px;width:auto;display:block}
.logo-block small{font-size:11px;color:var(--muted);white-space:nowrap}
.pf-list li{font-size:17px;align-items:center}
.pf-list{gap:12px;margin:4px 0}
.scrim.center{align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scrim.center .sheet{max-width:420px;border-radius:28px;padding:24px;animation:popin .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes popin{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.scrim.center .sheet.pp{padding:0;gap:0}
.pp-body{position:relative;padding:26px 22px 22px;display:flex;flex-direction:column;gap:18px;text-align:center}
.pp-x{position:absolute;top:16px;left:16px;width:40px;height:40px}
.pp-title{font-size:22px;font-weight:600;margin:6px 0 0;padding:0 40px;white-space:nowrap}
.pp-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));position:relative}
.pp-steps::before{content:"";position:absolute;top:17px;right:16.6%;left:16.6%;height:2px;background:#EFE3BC}
.pp-steps li{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px}
.pp-n{width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;animation:popin .35s both}
.pp-steps li:nth-child(2) .pp-n{animation-delay:.1s}.pp-steps li:nth-child(3) .pp-n{animation-delay:.2s}
.pp-t{font-size:14px}
.pp-body .pf-actions{gap:10px}
.pp-body .err:empty{display:none}
.btn-wa{background:var(--wa-bg);color:var(--wa-fg);border:1px solid var(--wa-line);text-decoration:none}
.pp-text{margin:0;color:var(--muted);font-size:16px;line-height:1.55}
/* ---------- money split ---------- */
.split{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:3px;margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:14px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%}

/* ---------- steps ---------- */
.step-ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.step-ic.done{background:var(--good-soft);color:var(--good)}
.step-ic.now{background:var(--brand);color:var(--on-brand)}
.step-ic.later{background:var(--bg);color:var(--muted)}


/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(15,12,6,.45);display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s ease}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:32px 32px 0 0;padding:12px 24px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:761px){.scrim{align-items:center}.sheet{border-radius:32px;padding-bottom:24px}}
.grab{width:40px;height:5px;border-radius:999px;background:var(--line);align-self:center}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.x{width:44px;height:44px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* ---------- consent / approval modal ---------- */
.modal .sheet{gap:16px}
.check{display:flex;gap:14px;align-items:flex-start;background:var(--bg);border-radius:20px;padding:16px;cursor:pointer;font-size:16px;line-height:1.45}
.check input{width:28px;height:28px;flex:none;margin:0;accent-color:var(--ink);cursor:pointer;border-radius:8px}
.check b{font-weight:600}
.link{color:var(--amber);font-weight:600;text-decoration:underline;text-underline-offset:3px;background:none;border:none;padding:0;font:inherit;cursor:pointer}
.legal{background:var(--bg);border-radius:20px;padding:16px 18px;max-height:240px;overflow:auto;font-size:14px;line-height:1.6;color:var(--ink)}

.legal .draft{display:block;margin-top:10px;color:var(--muted);font-size:12px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn-line{text-decoration:none;background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.modal-actions{display:flex;flex-direction:column;gap:10px}

/* ---------- success ---------- */
.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:32px 8px}
.success .ok-ic{width:88px;height:88px;border-radius:50%;background:var(--good-soft);color:var(--good);display:flex;align-items:center;justify-content:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:999px;font-weight:600;max-width:calc(100% - 32px);text-align:center}

.file-input{position:absolute;inset:0;opacity:0;cursor:pointer}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-top:8px}
.fade{animation:fadein .3s ease}

function amt(l){ return fmt(moSum(l))+' בחודש · '+fmt(annual(l))+' בשנה'; }
function bigAmt(l){ return `<div class="sav2"><div><span class="label">חיסכון שנתי</span><div class="big num">${fmt(annual(l))}</div></div><div><span class="label">חיסכון חודשי</span><div class="big num">${fmt(moSum(l))}</div></div></div>`; }

/* ---------- notify the office (silent) ---------- */
function notifyPlan(how,to){
  const body = {
    _subject: `בקשה לתוכנית כלכלית: ${CLIENT.name}`,
    _template:'table', _captcha:'false',
    'מה לעשות': `לשלוח ללקוח את התוכנית הכלכלית ${how==='wa'?'בוואטסאפ':'במייל'} ולתאם שיחה`,
    'שם הלקוח': CLIENT.name+' (לקוח לדוגמה)',
    'תעודת זהות': CLIENT.id,
    'איך לשלוח': how==='wa'?'וואטסאפ':'אימייל',
    'לאן לשלוח': to,
    'הזדמנויות בתוכנית': SAVE_ITEMS.map(x=>`${x.t}: ${fmt(mo(x))} בחודש · ${fmt(yr(x))} בשנה`).join('\n'),
    'חיסכון חודשי': fmt(moSum(SAVE_ITEMS)),
    'חיסכון שנתי': fmt(annual(SAVE_ITEMS)),
    'קישור לתוכנית': new URL('report.html', location.href).href,
    'מתי': new Date().toLocaleString('he-IL')
  };
  try{ sendLead(body); }catch(_){}
}
function notifyOffice(items, note){
  const lines = items.map(x=>`${x.t}: ${fmt(mo(x))} בחודש · ${fmt(yr(x))} בשנה`).join('\n');
  const body = {
    _subject: `פנייה חדשה מ-${CLIENT.name}: הנחה של ${fmt(annual(items))} בשנה`,
    _template: 'table', _captcha: 'false',
    'מה לעשות': 'להתקשר ללקוח ולהשלים את הבקשה מול החברות',
    'שם הלקוח': CLIENT.name + ' (לקוח לדוגמה)',
    'תעודת זהות': CLIENT.id,
    'טלפון': CLIENT.phone,
    'אימייל': CLIENT.email,
    'מה ביקש': lines,
    'חיסכון חודשי': fmt(moSum(items)),
    'חיסכון שנתי': fmt(annual(items)),
    'סטטוס': note || '',
    'מתי': new Date().toLocaleString('he-IL')
  };
  try{
    sendLead(body);
  }catch(_){}
}

/* ---------- navigation ---------- */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3000);}
const TABS=[['home','בית','home'],['insurance','ביטוחים','shield'],['pension','פנסיה','growth'],['journey','התהליך','route']];
const isTab = v => TABS.some(t=>t[0]===v);
const isSave = v => v==='save' || /^save-(p|f)\d$/.test(v);
const valid = v => isTab(v) || isSave(v);
let depth=0;
function go(v){ if(v===S.view) return; depth++; try{ location.hash=v; }catch(_){ show(v); } }
function show(v){ S.view = valid(v)?v:'home'; S.success=null; render(); window.scrollTo({top:0}); }
function back(){ if(depth>0){ depth--; history.back(); } else show('home'); }
window.addEventListener('hashchange',()=>{ if(location.hash==='#reset'){ location.reload(); return; } closeSheet(); show(location.hash.slice(1)); });

function insurance(){
  const rem = sum(left());
  return `<section class="page-title"><h1>ביטוחים</h1><div class="big num">${fmt(INS_TOTAL)}</div><span class="muted">בחודש, על ${POLICIES.length} ביטוחים</span></section>

    <span class="r-ic">${icon(p.ic,20)}</span>
    <span class="r-main"><b>${p.name}</b><small>${p.co}</small></span>
    <span class="r-end"><b class="num">${fmt(p.price)}</b>${rowTag(p.id)}</span>

}

function pension(){
  const life = POLICIES.find(p=>p.id==='p3'), work = POLICIES.find(p=>p.id==='p4');
  const liquid = FUNDS.find(f=>f.id==='f5').bal;
  const byEmp = [...new Set(FUNDS.map(f=>f.emp))];
  const colors = ['var(--c1)','var(--c3)','var(--c4)','var(--c5)'];
  const rem = sum(left());
  return `<section class="page-title"><h1>פנסיה וחיסכון</h1><div class="big num">${fmt(PEN_TOTAL)}</div><span class="muted">כל הכסף שלך, מכל העבודות</span>
    <div class="split" aria-hidden="true">${byEmp.map((e,i)=>`<i style="flex:${FUNDS.filter(f=>f.emp===e).reduce((a,f)=>a+f.bal,0)};background:${colors[i]}"></i>`).join('')}</div>
    <div class="legend">${byEmp.map((e,i)=>`<span><i style="background:${colors[i]}"></i>${e}</span>`).join('')}</div>
  </section>
  <section class="good">
    <div class="good-i"><span class="r-ic" style="background:var(--good-soft);color:var(--good)">${icon('growth',20)}</span><b>חיסכון קבוע</b><small>${fmt(FUNDS.reduce((a,f)=>a+f.monthly,0))} נכנסים לחיסכון כל חודש</small></div>
    <div class="good-i"><span class="r-ic" style="background:var(--good-soft);color:var(--good)">${icon('work',20)}</span><b>פנסיה פעילה</b><small>מהעבודה הנוכחית</small></div>
    <div class="good-i"><span class="r-ic" style="background:var(--good-soft);color:var(--good)">${icon('coins',20)}</span><b>כסף זמין</b><small>${fmt(liquid)} שאפשר למשוך בכל עת</small></div>
    <div class="good-i"><span class="r-ic" style="background:var(--good-soft);color:var(--good)">${icon('gift',20)}</span><b>קרן השתלמות</b><small>${fmt(FUNDS.find(f=>f.id==='f2').bal)}, נזילה מינואר 2027</small></div>
  </section>
  ${byEmp.map(e=>{const list=FUNDS.filter(f=>f.emp===e);return `<section class="rows"><div class="rows-title">${e}${list[0].current?' · העבודה הנוכחית':''}</div>
    ${list.map(f=>`<button class="r" data-sheet="pen:${f.id}">
      <span class="r-ic">${icon(f.name==='פנסיה'?'growth':'coins',20)}</span>
      <span class="r-main"><b>${f.name}</b><small>${f.co}</small></span>
      <span class="r-end"><b class="num">${fmt(f.bal)}</b>${f.found&&!S.done[f.id]?`<span class="tag ok">מצאנו לך</span>`:rowTag(f.id)}</span>

  <p class="foot">הנתונים לדוגמה · מקור: המסלקה הפנסיונית</p>`;
}

function journey(){
  const stepState = s => s.t==='ביטוחים' ? (left('ins').length? 'now':'done') : s.t==='פנסיה' ? (left('pen').length? 'now':'done') : s.s;
  const steps = STEPS.map(s=>({...s, st:stepState(s)}));
  const done = steps.filter(s=>s.st==='done').length;
  return `<section class="page-title"><h1>התהליך שלך</h1><div class="big num">${done} מתוך ${steps.length}</div><span class="muted">שלבים שסיימנו בשבילך</span>
    <div class="split" aria-hidden="true">${steps.map(s=>`<i style="flex:1;background:${s.st==='done'?'var(--ink)':s.st==='now'?'var(--brand)':'var(--line)'}"></i>`).join('')}</div></section>
  <section class="rows">${steps.map(s=>{const st=s.st;return `<div class="r">
    <span class="step-ic ${st}">${icon(st==='done'?'check':st==='now'?'bolt':'clock',20,st==='done'?2.4:1.9)}</span>
    <span class="r-main"><b>${s.t}</b><small>${st==='done'&&s.s!=='done'?'הבקשה התקבלה · נציג יחזור אליך':s.d}</small></span>
    <span class="tag ${st==='done'?'ok':st==='now'?'save':''}" style="${st==='later'?'color:var(--muted)':''}">${st==='done'?(s.s==='done'?'בוצע':'בטיפול'):st==='now'?'עכשיו':'בהמשך'}</span></div>`}).join('')}</section>
  <div class="card" style="display:flex;align-items:center;gap:14px"><span class="r-ic" style="background:var(--brand-soft);color:var(--amber)">${icon('gift',20)}</span><span style="flex:1"><span class="label" style="display:block">כבר חזר אליך</span><span class="mid num">${fmt(RETURNED)}</span></span></div>`;
}

function successHTML(items){
  const one = items.length===1;
  return `<section class="success"><span class="ok-ic">${icon('check',44,2.6)}</span><h1 style="font-size:28px">הבקשה שלך התקבלה</h1>
    <p class="muted" style="max-width:360px">נציג שלנו יחזור אליך בקרוב כדי להשלים את ההנחה${one?'':'ות'}. אין צורך לעשות שום דבר נוסף.</p>

}

function pendingItems(){
  const single = S.view!=='save';
  return single ? SAVE_ITEMS.filter(x=>'save-'+x.key===S.view && !S.done[x.key]) : left();
}
function submitCurrent(){
  const items = pendingItems();
  if(!items.length){ toast('כבר ביקשת את ההנחה הזו. אנחנו מטפלים בה'); return; }
  items.forEach(x=>S.done[x.key]={at:new Date().toISOString()});
  store.set('bitax_done', S.done);
  notifyOffice(items, 'הלקוח אישר את ההסכם וביקש את ההנחה');

  return `<div class="sheet-head"><div style="display:flex;flex-direction:column;gap:2px"><h2 style="font-size:26px">${f.name}</h2><span class="label">${f.co}</span><div style="margin-top:6px">${status}</div></div><button class="x" data-close aria-label="סגירה">${icon('x',20)}</button></div>
    <p style="font-size:17px">${f.what}</p>

const PLAN_FILE = `תוכנית כלכלית - ${CLIENT.name}.pdf`;
function planFooter(){
  return `<section class="rows plan-foot" id="plan-foot">

      <span class="chev">${icon('chev',18)}</span>
    </button>
  </section>`;
}
function planSheetHTML(){
  const ses = S.session || {};
  const pre = ses.how==='mail' ? ses.to : (S.mailSent ? S.mailSent.to : '');
  const steps = ['מה קיים','מה טוב','מה כדאי לשפר'];
  return `<div class="pp-body">
      <button class="x pp-x" data-close aria-label="סגירה">${icon('x',18)}</button>
      <h2 class="pp-title">התוכנית הכלכלית שלך</h2>
      <ol class="pp-steps">${steps.map((t,i)=>`<li><span class="pp-n num">${i+1}</span><span class="pp-t">${t}</span></li>`).join('')}</ol>
      <form id="pf-mail" class="pf-actions" novalidate>
        <input class="field" id="pf-to" type="email" inputmode="email" autocomplete="email" placeholder="אימייל" value="${pre}" aria-label="כתובת אימייל" style="direction:ltr;text-align:right">
        <div class="err" id="pf-err" role="alert"></div>
        <button class="btn btn-brand" type="submit">שלחו לי את התוכנית</button>
      </form>
    </div>`;
}
function openPlan(){
  S.sheet='plan'; const root=document.getElementById('sheet-root');
  root.innerHTML=`<div class="scrim center" data-close><div class="sheet pp" role="dialog" aria-modal="true" aria-label="התוכנית הכלכלית שלך">${planSheetHTML()}</div></div>`;
  const f=root.querySelector('#pf-to'); if(f && !f.value) f.focus();
}
/* more than 2 plans this month: friendly popup with WhatsApp instead */
function openPlanLimit(){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  S.sheet='plan-limit'; const root=document.getElementById('sheet-root');
  root.innerHTML=`<div class="scrim center" data-close><div class="sheet pp" role="dialog" aria-modal="true" aria-label="כבר קיבלת את התוכנית">
    <div class="pp-body">
      <button class="x pp-x" data-close aria-label="סגירה">${icon('x',18)}</button>

      <p class="pp-text">שלחנו לך את התוכנית הכלכלית למייל. נשמח לעזור בכל שאלה בוואטסאפ.</p>
      <div class="pf-actions"><a class="btn btn-wa" href="https://wa.me/message/BSJJNWU7KOG6B1" target="_blank" rel="noopener">${icon('chat',20)} לוואטסאפ</a></div>

function leadNote(action, extra){
  const ses = S.session || {};
  sendLead(Object.assign({
    _subject: `ליד חדש: ${CLIENT.name} ${action}`,
    'מה קרה': action,
    'מה לעשות': 'ליצור קשר עם הלקוח ולתאם שיחה על סידור תיק הביטוח והפנסיה',
    'שם הלקוח': CLIENT.name + ' (נתוני דוגמה)',
    'תעודת זהות שהוזנה': ses.id || '',
    'נכנס דרך': ses.how==='mail' ? 'אימייל' : 'SMS',
    'פרטי קשר': ses.to || '',
    'חיסכון אפשרי': amt(SAVE_ITEMS),
    'קישור לתוכנית': new URL(encodeURI('plans/'+PLAN_FILE), location.href).href,
    'מתי': new Date().toLocaleString('he-IL')
  }, extra||{}));
}

/* ---------- render + events ---------- */
function render(){
  if(!S.session){ document.getElementById('app').innerHTML = loginView(); return; }
  const firstHome = !S.rolled && S.view==='home';
  const v = isSave(S.view) ? saveView : {home,insurance,pension,journey}[S.view];
  document.getElementById('app').innerHTML = shell(v());
  if(firstHome) S.rolled = true;
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){closeSheet();go(g.dataset.go);return;}
  const sv=e.target.closest('[data-save]'); if(sv){closeSheet(); openPlan(); return;}
  const sh=e.target.closest('[data-sheet]'); if(sh){openSheet(sh.dataset.sheet);return;}
  if(e.target.closest('[data-act="back"]')){back();return;}
  if(e.target.closest('[data-act="submit"]')){approveModal();return;}
  if(e.target.closest('[data-act="toggle-legal"]')){e.preventDefault();const l=document.getElementById('legal');l.hidden=!l.hidden;return;}
  if(e.target.closest('[data-act="close-modal"]')){closeModal();return;}
  if(e.target.closest('[data-act="approve"]')){ if(!document.getElementById('ap-ok').checked) return; closeModal(); submitCurrent(); return;}
  if(e.target.closest('[data-act="human"]')){ notifyOffice(pendingItems(), 'הלקוח עוד לא אישר. ביקש לדבר עם סוכן אנושי'); closeModal(); toast('מעבירים אותך לסוכן שלנו בוואטסאפ'); return;}
  if(e.target.closest('[data-act="mkt-continue"]')){ if(!document.getElementById('mkt-ok').checked) return; S.mkt={at:new Date().toISOString()}; store.set('bitax_mkt',S.mkt); closeModal(); return;}
  if(S.modal) return;
  if(e.target.matches('[data-close]')||e.target.closest('.x')){closeSheet();}
});
document.addEventListener('click',e=>{
  const w=e.target.closest('[data-act="withdraw"]'); if(!w) return;
  const f=FUNDS.find(x=>x.id===w.dataset.id); S.wd[f.id]={at:new Date().toISOString()}; store.set('bitax_wd',S.wd);
  try{ sendLead({
    _subject:`בקשת משיכה: ${CLIENT.name} · ${f.name} ב${f.co}`, _template:'table', _captcha:'false',
    'מה לעשות':'להתקשר ללקוח ולהסביר את המשמעויות (מס, קנס) לפני כל פעולה',
    'שם הלקוח':CLIENT.name+' (לקוח לדוגמה)','תעודת זהות':CLIENT.id,'טלפון':CLIENT.phone,
    'מוצר':`${f.name} · ${f.co}`,'מעסיק':f.emp,'יתרה':fmt(f.bal),'מתי':new Date().toLocaleString('he-IL')}); }catch(_){}
  openSheet(S.sheet); toast('קיבלנו את הבקשה. נציג יחזור אליך');
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='plan-form') return;
  e.preventDefault();
  const v=document.getElementById('plan-to').value.trim(), err=document.getElementById('plan-err');
  const ok = S.how==='wa' ? /^0?5\d[- ]?\d{3}[- ]?\d{4}$|^\+?972[- ]?5\d[- ]?\d{3}[- ]?\d{4}$/.test(v) : /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  if(!ok){ err.textContent = S.how==='wa' ? 'המספר לא נראה תקין. למשל: 050-1234567.' : 'הכתובת לא נראית תקינה. צריך @ ונקודה.'; return; }
  S.plan={how:S.how,to:v,at:new Date().toISOString()}; store.set('bitax_plan',S.plan);
  SAVE_ITEMS.forEach(x=>{ if(!S.done[x.key]) S.done[x.key]={at:S.plan.at}; }); store.set('bitax_done',S.done);
  notifyPlan(S.how,v); render(); window.scrollTo({top:0});
});
document.addEventListener('change',e=>{ if(e.target.name==='how'){ S.how=e.target.value; render(); const f=document.getElementById('plan-to'); if(f) f.focus(); } });

document.addEventListener('submit',e=>{
  const A=S.auth;
  if(e.target.id==='lg-form'){
    e.preventDefault();
    A.id=document.getElementById('lg-id').value.replace(/\D/g,''); A.to=document.getElementById('lg-to').value.trim();
    if(!validId(A.id)) A.err='מספר תעודת הזהות לא תקין. צריך 9 ספרות, כולל ספרת ביקורת.';
    else if(A.how==='sms' && !okPhone(A.to)) A.err='מספר הנייד לא נראה תקין. למשל: 050-1234567.';
    else if(A.how==='mail' && !okMail(A.to)) A.err='כתובת האימייל לא נראית תקינה.';
    else if(A.how==='mail' && MAIL_API){
      A.err=''; const btn=e.target.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='שולחים…';
      api({type:'code', to:A.to}).then(r=>{ if(r.ok){ A.server=true; A.step='code'; } else A.err='לא הצלחנו לשלוח קוד. אפשר לנסות שוב.'; render(); const f=document.getElementById('lg-otp'); if(f) f.focus(); })
        .catch(()=>{ A.err='לא הצלחנו לשלוח קוד. אפשר לנסות שוב.'; render(); });
      return;
    }
    else { A.err=''; A.server=false; A.step='code'; newCode(); }
    render(); const f=document.getElementById(A.step==='code'?'lg-otp':'lg-id'); if(f) f.focus(); return;
  }
  if(e.target.id==='lg-code'){
    e.preventDefault();
    const v=document.getElementById('lg-otp').value.trim();
    if(v.length<6){ A.err='הקוד צריך להכיל 6 ספרות.'; render(); return; }
    const enter = () => { S.session={id:A.id, how:A.how, to:A.to, at:new Date().toISOString()}; store.set('bitax_session',S.session);
    A.err=''; A.step='id'; S.view='home'; S.rolled=false;
    try{ history.replaceState(null,'','#home'); }catch(_){}
    render(); window.scrollTo({top:0}); if(!S.mkt) consentModal(); };
    if(A.server){ api({type:'verify', to:A.to, code:v}).then(r=>{ if(r.ok) enter(); else { A.err='הקוד שגוי או שפג תוקפו. אפשר לבקש קוד חדש.'; render(); } }).catch(()=>{ A.err='לא הצלחנו לבדוק את הקוד. אפשר לנסות שוב.'; render(); }); return; }
    if(v!==A.code){ A.err='הקוד שגוי. אפשר לנסות שוב או לבקש קוד חדש.'; render(); return; }
    enter(); return;
  }
  if(e.target.id==='pf-mail'){
    e.preventDefault();
    const v=document.getElementById('pf-to').value.trim();
    if(!okMail(v)){ document.getElementById('pf-err').textContent='כתובת האימייל לא נראית תקינה.'; return; }
    closeSheet(); sendPlanMail(v);
  }
});
document.addEventListener('change',e=>{ if(e.target.name==='lg-how'){ const idEl=document.getElementById('lg-id'); if(idEl) S.auth.id=idEl.value.replace(/\D/g,''); S.auth.how=e.target.value; S.auth.to=''; S.auth.err=''; render(); const id=document.getElementById('lg-id'), f=document.getElementById('lg-to'); const t=(id && !id.value.trim()) ? id : f; if(t) t.focus(); } });
document.addEventListener('input',e=>{ if(e.target.id==='lg-otp'||e.target.id==='lg-id') e.target.value=e.target.value.replace(/\D/g,''); });
document.addEventListener('click',e=>{
  if(e.target.closest('[data-act="lg-back"]')){ S.auth.step='id'; S.auth.err=''; render(); return; }
  if(e.target.closest('[data-act="lg-resend"]')){ S.auth.err=''; if(S.auth.server){ api({type:'code',to:S.auth.to}).then(()=>toast('שלחנו קוד חדש למייל')).catch(()=>toast('לא הצלחנו לשלוח. נסו שוב')); } else { newCode(); render(); toast('שלחנו קוד חדש'); } return; }
  if(e.target.closest('[data-act="open-plan"]')){ openPlan(); return; }
  if(e.target.closest('[data-act="logout"]')){ S.session=null; try{localStorage.removeItem('bitax_session')}catch(_){}; S.auth={step:'id',id:'',how:'sms',to:'',err:'',code:''}; render(); window.scrollTo({top:0}); return; }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){ if(S.modal==='approve') closeModal(); else if(S.sheet && !S.modal) closeSheet(); }});
document.addEventListener('change',e=>{
  if(e.target.id==='mkt-ok') document.getElementById('mkt-go').disabled=!e.target.checked;
  if(e.target.id==='ap-ok') document.getElementById('ap-go').disabled=!e.target.checked;
});
document.addEventListener('change',e=>{if(e.target.id==='f106'&&e.target.files[0]){S.f106=true;render();toast('קיבלנו, תודה! נבדוק אם מגיע לך עוד החזר');}});
{ const h = location.hash.slice(1); S.view = isTab(h) ? h : 'home'; if(h && !isTab(h)) try{ history.replaceState(null,'','#home'); }catch(_){} }
render();
if(S.session && !S.mkt) consentModal();
</script>
